<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reference Architecture</title>
    <meta
      name="description"
      content="The baseline I copy when I start a product: a NestJS API on one DynamoDB table with a React frontend, deployed with Terraform to ECS Fargate and to Lambda. This is the live demo."
    />

    <!-- The theme. public/theme.js sets data-theme on <html> before first
         paint and sets theme-color to the page colour of the theme in use
         (#fbfbf8 or #141917), so the meta tag must come first. It is a file
         and not an inline script because Helmet's content security policy
         only runs scripts from this origin. -->
    <meta name="theme-color" content="#fbfbf8" />
    <script vite-ignore src="/theme.js"></script>

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The two Latin fonts carry everything above the fold. Vite rewrites
         these to the same fingerprinted files the stylesheet asks for. -->
    <link rel="preload" href="/src/styles/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/styles/fonts/spline-sans-mono-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- One bundle serves every deployment, so there is no og:url, and the
         image is the copy on the first deployment. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reference Architecture" />
    <meta property="og:title" content="Reference Architecture" />
    <meta
      property="og:description"
      content="The baseline I copy when I start a product: a NestJS API on one DynamoDB table with a React frontend, deployed with Terraform to ECS Fargate and to Lambda."
    />
    <meta property="og:image" content="https://reference-architecture.603.nz/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The baseline I copy when I start a product." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
